<!-- Una noticia dentro del newsletter. Marcadores: {{Fecha}} {{TituloNoticia}} {{Resumen}} {{UrlNoticia}} {{TextoLeerMas}} -->
<table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%"
       style="margin:0 0 16px 0;border:1px solid #e2e8f0;border-radius:8px;">
  <tr>
    <td style="padding:16px 18px;">
      <p style="margin:0 0 4px 0;font-size:12px;color:#64748b;">{{Fecha}}</p>
      <p style="margin:0 0 8px 0;font-size:17px;line-height:1.4;color:#0f172a;font-weight:600;">{{TituloNoticia}}</p>
      <p style="margin:0 0 10px 0;white-space:pre-line;">{{Resumen}}</p>
      <a href="{{UrlNoticia}}" style="color:#2563eb;font-weight:600;text-decoration:none;">{{TextoLeerMas}} &rarr;</a>
    </td>
  </tr>
</table>
