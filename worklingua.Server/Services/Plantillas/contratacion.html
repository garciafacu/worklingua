<!-- Cuerpo del aviso de contratacion (aprobada, rechazada o cancelada).
     Marcadores: {{Saludo}} {{Mensaje}} {{Detalle}} (filas ya armadas con contratacion-fila) -->
<p style="margin:0 0 14px 0;">{{Saludo}}</p>

<p style="margin:0 0 18px 0;">
  {{Mensaje}}
</p>

<table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%"
       style="border-collapse:collapse;border:1px solid #e2e8f0;border-radius:8px;font-size:14px;">
  {{Detalle}}
</table>
