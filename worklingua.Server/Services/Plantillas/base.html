<!--
  Layout comun de todos los emails de WorkLingua.
  Este es el UNICO archivo con cabecera, marca, tipografia, boton y pie:
  agregar un email nuevo es agregar una plantilla de cuerpo, sin tocar esto.

  Marcadores: {{Titulo}} {{Cuerpo}} {{TextoBoton}} {{UrlBoton}} {{TextoEnlaceAlternativo}}
              {{NotaPie}} {{PieExtra}} {{Anio}}

  {{Cuerpo}} y {{PieExtra}} llegan como HTML ya armado (sin codificar); el resto
  de los valores se codifica. {{PieExtra}} vacio no deja rastro en el pie.

  Se usa maquetado con tablas y estilos inline porque es lo unico que renderiza
  de forma consistente en los clientes de correo (Outlook, Gmail, Apple Mail).
-->
<table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%"
       style="background-color:#f1f5f9;margin:0;padding:24px 12px;font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <tr>
    <td align="center">

      <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="600"
             style="max-width:600px;width:100%;background-color:#ffffff;border-radius:12px;overflow:hidden;border:1px solid #e2e8f0;">

        <!-- Cabecera -->
        <tr>
          <td style="background-color:#1e3a5f;padding:28px 32px;">
            <span style="color:#ffffff;font-size:22px;font-weight:700;letter-spacing:-0.3px;">
              Work<span style="color:#60a5fa;">Lingua</span>
            </span>
          </td>
        </tr>

        <!-- Contenido -->
        <tr>
          <td style="padding:32px;">

            <h1 style="margin:0 0 16px 0;font-size:20px;line-height:1.35;color:#0f172a;font-weight:600;">
              {{Titulo}}
            </h1>

            <div style="font-size:15px;line-height:1.65;color:#334155;">
              {{Cuerpo}}
            </div>

            <!-- Boton de accion -->
            <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:28px 0 8px 0;">
              <tr>
                <td style="background-color:#2563eb;border-radius:8px;">
                  <a href="{{UrlBoton}}"
                     style="display:inline-block;padding:13px 26px;font-size:15px;font-weight:600;color:#ffffff;text-decoration:none;">
                    {{TextoBoton}}
                  </a>
                </td>
              </tr>
            </table>

            <p style="margin:20px 0 0 0;font-size:13px;line-height:1.6;color:#64748b;">
              {{TextoEnlaceAlternativo}}<br />
              <span style="color:#2563eb;word-break:break-all;">{{UrlBoton}}</span>
            </p>

          </td>
        </tr>

        <!-- Pie -->
        <tr>
          <td style="background-color:#f8fafc;padding:20px 32px;border-top:1px solid #e2e8f0;">
            <p style="margin:0;font-size:12px;line-height:1.6;color:#94a3b8;">
              {{NotaPie}}
            </p>
            {{PieExtra}}
            <p style="margin:8px 0 0 0;font-size:12px;color:#94a3b8;">
              &copy; {{Anio}} WorkLingua
            </p>
          </td>
        </tr>

      </table>

    </td>
  </tr>
</table>
