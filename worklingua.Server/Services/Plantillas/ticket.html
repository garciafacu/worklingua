<!-- Cuerpo del aviso de una consulta de soporte (respondida, tomada o cerrada).
     Marcadores: {{Saludo}} {{Mensaje}} {{Detalle}} (filas ya armadas con contratacion-fila)
                 {{EtiquetaRespuesta}} {{Respuesta}} (vacios cuando no hay respuesta) -->
<p style="margin:0 0 14px 0;">{{Saludo}}</p>

<p style="margin:0 0 18px 0;">
  {{Mensaje}}
</p>

<table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%"
       style="border-collapse:collapse;border:1px solid #e2e8f0;border-radius:8px;font-size:14px;">
  {{Detalle}}
</table>

<p style="margin:18px 0 6px 0;font-size:13px;font-weight:600;color:#64748b;">{{EtiquetaRespuesta}}</p>
<div style="white-space:pre-line;font-size:14px;color:#0f172a;">{{Respuesta}}</div>
